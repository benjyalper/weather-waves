<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skin Admin — אל הים</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 20px 100px;
    }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; color: #f8fafc; }
    .subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 8px; }
    .today-indicator { font-size: 0.75rem; color: #64748b; margin-bottom: 28px; }
    .today-indicator span { color: #94a3b8; font-weight: 600; }

    /* ── Section headers ── */
    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }

    /* ── Skin grid ── */
    .skin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin-bottom: 48px;
    }

    .skin-card {
      background: #1e293b;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .skin-card.active-now { border-color: #22c55e; }
    .skin-card.scheduled  { border-color: #3b82f6; }

    .skin-thumb {
      width: 100%; height: 130px;
      object-fit: cover; object-position: center top;
      display: block; background: #0f172a;
    }
    .skin-body { padding: 16px; }
    .skin-name {
      font-size: 1rem; font-weight: 700; margin-bottom: 4px;
      display: flex; align-items: center; gap: 8px;
    }

    .badge { font-size: 0.65rem; font-weight: 600; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.5px; }
    .badge-active    { background: #14532d; color: #4ade80; }
    .badge-scheduled { background: #1e3a5f; color: #60a5fa; }
    .badge-default   { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

    .date-row { display: flex; gap: 10px; margin: 14px 0 16px; align-items: center; }
    .date-row label { font-size: 0.72rem; color: #94a3b8; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .date-row input[type="date"] {
      width: 100%; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: #e2e8f0; padding: 6px 10px; font-size: 0.82rem; outline: none;
    }
    .date-row input[type="date"]:focus { border-color: #3b82f6; }
    .arrow { color: #475569; font-size: 1.1rem; margin-top: 16px; }

    .card-actions { display: flex; gap: 8px; }

    button {
      border: none; border-radius: 8px; padding: 8px 16px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-save    { background: #3b82f6; color: #fff; flex: 1; }
    .btn-remove  { background: #334155; color: #94a3b8; }
    .btn-add     { background: #1e3a5f; color: #60a5fa; flex: 1; }
    .btn-dl      { background: #1e293b; color: #64748b; border: 1px solid #334155; }

    /* ── Save bar ── */
    .save-all-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1e293b; border-top: 1px solid #334155;
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .save-all-bar .status { font-size: 0.82rem; color: #64748b; }
    .save-all-bar .status.ok    { color: #4ade80; }
    .save-all-bar .status.error { color: #f87171; }
    .btn-save-all  { background: #22c55e; color: #052e16; padding: 10px 28px; font-size: 0.9rem; }
    .btn-deploy    { background: #7c3aed; color: #fff;    padding: 10px 20px; font-size: 0.9rem; }
    .btn-deploy:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-revert    { background: #1e293b; color: #94a3b8; padding: 10px 20px; font-size: 0.9rem; border: 1px solid #334155; }
    .btn-revert:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Upload panel ── */
    .upload-panel {
      max-width: 520px;
      background: #1e293b;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 48px;
    }

    .drop-zone {
      border: 2px dashed #334155; border-radius: 12px;
      padding: 36px 24px; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 20px; position: relative;
    }
    .drop-zone.drag-over { border-color: #3b82f6; background: #1e3a5f; }
    .drop-zone.has-file  { border-color: #22c55e; background: #052e16; }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon { font-size: 2rem; margin-bottom: 8px; }
    .drop-label { font-size: 0.88rem; color: #94a3b8; }
    .drop-label strong { color: #e2e8f0; }
    .drop-hint { font-size: 0.72rem; color: #475569; margin-top: 4px; }
    .file-chosen { font-size: 0.82rem; color: #4ade80; margin-top: 6px; }

    .preview-thumb {
      width: 100%; max-height: 160px; object-fit: cover; object-position: top;
      border-radius: 8px; margin-bottom: 16px; display: none;
    }

    .field-label { font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: #e2e8f0; padding: 10px 14px; font-size: 0.9rem; outline: none; margin-bottom: 6px;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    .name-hint { font-size: 0.7rem; color: #475569; margin-bottom: 16px; }

    .btn-upload {
      width: 100%; background: #3b82f6; color: #fff; border: none;
      border-radius: 10px; padding: 11px; font-size: 0.92rem; font-weight: 700; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-upload:hover { opacity: 0.85; }
    .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; }

    .progress-bar { height: 5px; background: #0f172a; border-radius: 3px; overflow: hidden; margin-top: 14px; display: none; }
    .progress-fill { height: 100%; background: #3b82f6; width: 0%; transition: width 0.3s; border-radius: 3px; }

    .upload-status { margin-top: 12px; font-size: 0.82rem; min-height: 1.2em; }
    .upload-status.ok    { color: #4ade80; }
    .upload-status.error { color: #f87171; }
    .upload-status.info  { color: #60a5fa; }

    /* ── Mobile (iPhone) ─────────────────────────────────────────────────── */
    @media (max-width: 540px) {
      body { padding: 20px 14px 140px; }

      h1 { font-size: 1.2rem; }
      .subtitle { font-size: 0.78rem; }
      .today-indicator { margin-bottom: 18px; }

      /* Single-column card grid */
      .skin-grid {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 32px;
      }

      /* Shorter thumbnail on mobile */
      .skin-thumb { height: 100px; }

      .skin-body { padding: 12px; }
      .skin-name { font-size: 0.92rem; }

      /* Tighter date row */
      .date-row { gap: 6px; margin: 10px 0 12px; }
      .date-row input[type="date"] { padding: 5px 7px; font-size: 0.76rem; }
      .arrow { font-size: 0.9rem; margin-top: 14px; }

      /* Card buttons full-width stack */
      .card-actions { flex-wrap: wrap; }
      .btn-save, .btn-add { min-width: 0; }
      .btn-dl { margin-left: auto; }

      /* Upload panel full width, less padding */
      .upload-panel {
        max-width: 100%;
        padding: 18px 14px;
        margin-bottom: 28px;
        border-radius: 12px;
      }

      .drop-zone { padding: 22px 16px; margin-bottom: 14px; }
      .drop-icon { font-size: 1.6rem; margin-bottom: 4px; }

      .preview-thumb { max-height: 110px; }

      /* Bottom bar — stack vertically */
      .save-all-bar {
        flex-direction: column;
        align-items: stretch;
        padding: 12px 14px;
        gap: 10px;
      }
      .save-all-bar .status { text-align: center; }
      .save-all-bar > div {
        display: flex !important;
        flex-direction: column;
        gap: 8px;
      }
      .btn-revert, .btn-deploy, .btn-save-all {
        width: 100%;
        padding: 12px;
        font-size: 0.88rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<h1>🎨 Skin Admin</h1>
<p class="subtitle">Manage skins and their display schedule.</p>
<p class="today-indicator">Today: <span id="todayDisplay">—</span></p>

<!-- ── Upload new skin ── -->
<p class="section-title">Upload New Skin</p>
<div class="upload-panel">
  <img class="preview-thumb" id="previewThumb" alt="preview" />

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".png,image/png" />
    <div class="drop-icon">🖼️</div>
    <div class="drop-label"><strong>Drop PNG here</strong></div>
    <div class="drop-hint">1024 × 1536 px only</div>
    <div class="file-chosen" id="fileChosen"></div>
  </div>

  <label class="field-label" for="skinName">Skin name</label>
  <input type="text" id="skinName" placeholder="e.g. rosh-hashana" maxlength="40" />
  <p class="name-hint">Lowercase letters, numbers, and hyphens only.</p>

  <button class="btn-upload" id="uploadBtn" disabled onclick="doUpload()">Upload & Slice → Push to dev</button>

  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="upload-status" id="uploadStatus"></div>
</div>

<!-- ── Schedule ── -->
<p class="section-title">Schedule</p>
<div class="skin-grid" id="skinGrid"></div>

<div class="save-all-bar">
  <span class="status" id="statusMsg">No unsaved changes.</span>
  <div style="display:flex;gap:10px">
    <button class="btn-revert" id="revertBtn" onclick="revertMain()" title="Clear skin-schedule.json on main — shows default ocean blue">↩ Revert to Default</button>
    <button class="btn-deploy" id="deployBtn" onclick="deployToMain()" title="Push the currently live skin + its schedule to the main branch">🚀 Deploy to Main</button>
    <button class="btn-save-all" onclick="saveAll()">Save & Push to Dev</button>
  </div>
</div>

<script>
  // ── Upload ────────────────────────────────────────────────────────────────
  const dropZone    = document.getElementById('dropZone');
  const fileInput   = document.getElementById('fileInput');
  const fileChosen  = document.getElementById('fileChosen');
  const previewThumb = document.getElementById('previewThumb');
  const skinNameEl  = document.getElementById('skinName');
  const uploadBtn   = document.getElementById('uploadBtn');

  let selectedFile = null;

  function setUploadStatus(msg, cls) {
    const el = document.getElementById('uploadStatus');
    el.textContent = msg;
    el.className = 'upload-status ' + (cls || '');
  }

  function checkUploadReady() {
    const nameOk = /^[a-z0-9][a-z0-9-]*$/.test(skinNameEl.value.trim());
    uploadBtn.disabled = !(selectedFile && nameOk);
  }

  skinNameEl.addEventListener('input', () => {
    skinNameEl.value = skinNameEl.value.toLowerCase().replace(/[^a-z0-9-]/g, '-');
    checkUploadReady();
  });

  function handleFile(file) {
    if (!file || file.type !== 'image/png') { setUploadStatus('Only PNG files are accepted.', 'error'); return; }
    selectedFile = file;
    fileChosen.textContent = file.name;
    dropZone.classList.add('has-file');
    previewThumb.src = URL.createObjectURL(file);
    previewThumb.style.display = 'block';
    setUploadStatus('', '');
    checkUploadReady();
  }

  fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  async function doUpload() {
    const name = skinNameEl.value.trim();
    if (!name || !selectedFile) return;

    uploadBtn.disabled = true;
    setUploadStatus('Slicing…', 'info');
    const bar = document.getElementById('progressBar');
    const fill = document.getElementById('progressFill');
    bar.style.display = 'block';
    fill.style.width = '20%';

    const fd = new FormData();
    fd.append('png', selectedFile);
    fd.append('name', name);

    try {
      fill.style.width = '60%';
      const r = await fetch('/api/upload-skin', { method: 'POST', body: fd });
      fill.style.width = '90%';
      const result = await r.json();
      if (!r.ok) throw new Error(result.error || 'Upload failed');
      fill.style.width = '100%';

      const pushMsg = result.pushed ? 'pushed to dev ✓' : 'saved locally (git push failed)';
      setUploadStatus(`Skin "${name}" sliced & ${pushMsg}`, result.pushed ? 'ok' : 'error');

      // Refresh the schedule grid so new skin appears
      refreshSkins();
    } catch (e) {
      setUploadStatus(e.message, 'error');
      uploadBtn.disabled = false;
    }
  }

  // ── Schedule ──────────────────────────────────────────────────────────────
  const YEAR = new Date().getFullYear();

  function toInputDate(mmdd) { return mmdd ? `${YEAR}-${mmdd}` : ''; }
  function fromInputDate(val) { return val ? val.slice(5) : ''; }
  function todayMmdd() { return new Date().toLocaleDateString('sv-SE').slice(5); }

  let skins = [], schedule = [], dirty = false;

  function markDirty() { dirty = true; setStatus('Unsaved changes.', ''); }
  function setStatus(msg, cls) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status ' + (cls || '');
  }

  function isActiveNow(entry) {
    const today = todayMmdd();
    return entry && today >= entry.start && today <= entry.end;
  }
  function getEntry(name) { return schedule.find(s => s.name === name) || null; }

  function renderGrid() {
    document.getElementById('todayDisplay').textContent = todayMmdd();
    const grid = document.getElementById('skinGrid');
    grid.innerHTML = '';
    const ordered = ['default', ...skins.filter(s => s !== 'default')];

    ordered.forEach(name => {
      const isDefault = name === 'default';
      const entry   = getEntry(name);
      const active  = isDefault
        ? !schedule.some(s => s.name !== 'default' && isActiveNow(s))
        : (entry && isActiveNow(entry));
      const scheduled = !isDefault && entry && !active;

      const card = document.createElement('div');
      card.className = 'skin-card' + (active ? ' active-now' : scheduled ? ' scheduled' : '');
      card.innerHTML = `
        <img class="skin-thumb"
             src="/skins/${name}/skin/header-bg.png"
             onerror="this.style.cssText='background:#0c2a4a;background-image:linear-gradient(135deg,#0D47A1,#0288D1)'"
             alt="${name}">
        <div class="skin-body">
          <div class="skin-name">
            ${isDefault ? 'Default (Ocean Blue)' : name}
            ${active    ? '<span class="badge badge-active">● LIVE NOW</span>' : ''}
            ${scheduled ? '<span class="badge badge-scheduled">● SCHEDULED</span>' : ''}
            ${isDefault && !active ? '<span class="badge badge-default">fallback</span>' : ''}
          </div>
          ${isDefault ? '<p style="font-size:0.75rem;color:#64748b;margin-bottom:12px">Always shown when no other skin is active.</p>' : `
          <div class="date-row">
            <label>From
              <input type="date" id="start-${name}" value="${entry ? toInputDate(entry.start) : ''}" onchange="onDateChange('${name}')">
            </label>
            <span class="arrow">→</span>
            <label>Until
              <input type="date" id="end-${name}" value="${entry ? toInputDate(entry.end) : ''}" onchange="onDateChange('${name}')">
            </label>
          </div>
          <div class="card-actions">
            ${entry
              ? `<button class="btn-save" onclick="saveCard('${name}')">Apply</button>
                 <button class="btn-remove" onclick="removeCard('${name}')">Remove</button>`
              : `<button class="btn-add" onclick="addCard('${name}')">Add to schedule</button>`}
            <button class="btn-dl" onclick="window.location='/api/download-skin/${name}'">↓ ZIP</button>
          </div>`}
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function onDateChange(name) {
    markDirty();
    const entry = getEntry(name);
    if (entry) {
      entry.start = fromInputDate(document.getElementById(`start-${name}`).value);
      entry.end   = fromInputDate(document.getElementById(`end-${name}`).value);
    }
  }

  function saveCard(name) {
    const start = fromInputDate(document.getElementById(`start-${name}`).value);
    const end   = fromInputDate(document.getElementById(`end-${name}`).value);
    const entry = getEntry(name);
    if (entry) { entry.start = start; entry.end = end; }
    markDirty(); renderGrid();
  }

  function addCard(name) { schedule.push({ name, label: name, start: '', end: '' }); markDirty(); renderGrid(); }
  function removeCard(name) { schedule = schedule.filter(s => s.name !== name); markDirty(); renderGrid(); }

  async function saveAll() {
    const valid = schedule.filter(s => s.start && s.end);
    try {
      const r = await fetch('/api/schedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(valid, null, 2)
      });
      if (!r.ok) throw new Error('Server error');
      const result = await r.json();
      schedule = valid;
      dirty = false;
      const msg = result.pushed ? 'Saved & pushed to dev!' : 'Saved locally (git push failed)';
      setStatus(msg, result.pushed ? 'ok' : 'error');
      setTimeout(() => setStatus('No unsaved changes.', ''), 4000);
      renderGrid();
    } catch (e) {
      setStatus('Save failed: ' + e.message, 'error');
    }
  }

  function refreshSkins() {
    Promise.all([
      fetch('/api/skins').then(r => r.json()),
      fetch('/api/schedule').then(r => r.json())
    ]).then(([s, sc]) => { skins = s; schedule = sc; renderGrid(); });
  }

  // ── Deploy to Main ────────────────────────────────────────────────────────
  async function deployToMain() {
    const btn = document.getElementById('deployBtn');
    btn.disabled = true;
    btn.textContent = '🚀 Deploying…';
    setStatus('Deploying to main…', '');
    try {
      const r = await fetch('/api/deploy-to-main', { method: 'POST' });
      const result = await r.json();
      if (!r.ok) throw new Error(result.error || 'Deploy failed');
      setStatus(`✓ "${result.skin}" deployed to main!`, 'ok');
      setTimeout(() => setStatus('No unsaved changes.', ''), 6000);
    } catch (e) {
      setStatus('Deploy failed: ' + e.message, 'error');
    }
    btn.disabled = false;
    btn.textContent = '🚀 Deploy to Main';
  }

  async function revertMain() {
    if (!confirm('Revert main to default ocean blue? This clears the skin schedule on main.')) return;
    const btn = document.getElementById('revertBtn');
    btn.disabled = true;
    btn.textContent = '↩ Reverting…';
    setStatus('Reverting main to default…', '');
    try {
      const r = await fetch('/api/revert-main-to-default', { method: 'POST' });
      const result = await r.json();
      if (!r.ok) throw new Error(result.error || 'Revert failed');
      setStatus('✓ Main reverted to default ocean skin!', 'ok');
      setTimeout(() => setStatus('No unsaved changes.', ''), 6000);
    } catch (e) {
      setStatus('Revert failed: ' + e.message, 'error');
    }
    btn.disabled = false;
    btn.textContent = '↩ Revert to Default';
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  refreshSkins();
</script>

</body>
</html>
