<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skin Uploader — אל הים</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; color: #f8fafc; }
    .subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 36px; }

    .nav-link {
      display: inline-block;
      margin-bottom: 28px;
      font-size: 0.8rem;
      color: #60a5fa;
      text-decoration: none;
    }
    .nav-link:hover { text-decoration: underline; }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 32px;
      max-width: 520px;
    }

    .drop-zone {
      border: 2px dashed #334155;
      border-radius: 12px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 24px;
      position: relative;
    }
    .drop-zone.drag-over { border-color: #3b82f6; background: #1e3a5f; }
    .drop-zone.has-file  { border-color: #22c55e; background: #052e16; }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .drop-label { font-size: 0.9rem; color: #94a3b8; }
    .drop-label strong { color: #e2e8f0; }
    .drop-hint { font-size: 0.75rem; color: #475569; margin-top: 6px; }
    .file-chosen { font-size: 0.85rem; color: #4ade80; margin-top: 8px; }

    .preview-thumb {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      object-position: top;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }

    label.field-label {
      font-size: 0.75rem;
      color: #94a3b8;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 20px;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    input[type="text"].error { border-color: #f87171; }

    .name-hint {
      font-size: 0.72rem;
      color: #475569;
      margin-top: -16px;
      margin-bottom: 20px;
    }

    .btn-upload {
      width: 100%;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-upload:hover { opacity: 0.85; }
    .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; }

    .progress-bar {
      height: 6px;
      background: #0f172a;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 16px;
      display: none;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      width: 0%;
      transition: width 0.3s;
      border-radius: 3px;
    }

    .status-msg {
      margin-top: 16px;
      font-size: 0.85rem;
      min-height: 1.2em;
    }
    .status-msg.ok    { color: #4ade80; }
    .status-msg.error { color: #f87171; }
    .status-msg.info  { color: #60a5fa; }

    .slices-preview {
      display: none;
      margin-top: 24px;
      border-top: 1px solid #334155;
      padding-top: 20px;
    }
    .slices-preview h3 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 14px; }
    .slices-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .slice-thumb {
      border-radius: 6px;
      overflow: hidden;
      background: #0f172a;
      font-size: 0.65rem;
      color: #475569;
      text-align: center;
    }
    .slice-thumb img { width: 100%; display: block; }
    .slice-thumb span { display: block; padding: 3px 4px; }
  </style>
</head>
<body>

<a class="nav-link" href="/admin.html">← Back to Admin</a>
<h1>Skin Uploader</h1>
<p class="subtitle">Upload a 1024×1536 PNG — it will be auto-sliced and saved as a new skin.</p>

<div class="card">
  <img class="preview-thumb" id="previewThumb" alt="preview" />

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".png,image/png" />
    <div class="drop-icon">🖼️</div>
    <div class="drop-label"><strong>Drop your PNG here</strong></div>
    <div class="drop-hint">or click to browse — 1024 × 1536 px only</div>
    <div class="file-chosen" id="fileChosen"></div>
  </div>

  <label class="field-label" for="skinName">Skin name</label>
  <input type="text" id="skinName" placeholder="e.g. rosh-hashana" maxlength="40" />
  <p class="name-hint">Lowercase letters, numbers, and hyphens only.</p>

  <button class="btn-upload" id="uploadBtn" disabled onclick="doUpload()">Upload & Slice</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="slices-preview" id="slicesPreview">
    <h3>Slices saved to server:</h3>
    <div class="slices-grid" id="slicesGrid"></div>
  </div>
</div>

<script>
  const dropZone   = document.getElementById('dropZone');
  const fileInput  = document.getElementById('fileInput');
  const fileChosen = document.getElementById('fileChosen');
  const previewThumb = document.getElementById('previewThumb');
  const skinNameEl = document.getElementById('skinName');
  const uploadBtn  = document.getElementById('uploadBtn');

  let selectedFile = null;

  function setStatus(msg, cls) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg ' + (cls || '');
  }

  function checkReady() {
    const nameOk = /^[a-z0-9][a-z0-9-]*$/.test(skinNameEl.value.trim());
    uploadBtn.disabled = !(selectedFile && nameOk);
  }

  skinNameEl.addEventListener('input', () => {
    // Auto-sanitize on type
    skinNameEl.value = skinNameEl.value.toLowerCase().replace(/[^a-z0-9-]/g, '-');
    checkReady();
  });

  function handleFile(file) {
    if (!file || file.type !== 'image/png') {
      setStatus('Only PNG files are accepted.', 'error');
      return;
    }
    selectedFile = file;
    fileChosen.textContent = file.name;
    dropZone.classList.add('has-file');
    dropZone.classList.remove('drag-over');

    // Show preview
    const url = URL.createObjectURL(file);
    previewThumb.src = url;
    previewThumb.style.display = 'block';

    setStatus('', '');
    checkReady();
  }

  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('drag-over');
  });
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  async function doUpload() {
    const name = skinNameEl.value.trim();
    if (!name || !selectedFile) return;

    uploadBtn.disabled = true;
    setStatus('Slicing…', 'info');

    const bar = document.getElementById('progressBar');
    const fill = document.getElementById('progressFill');
    bar.style.display = 'block';
    fill.style.width = '20%';

    const fd = new FormData();
    fd.append('png', selectedFile);
    fd.append('name', name);

    try {
      fill.style.width = '50%';
      const r = await fetch('/api/upload-skin', { method: 'POST', body: fd });
      fill.style.width = '90%';

      if (!r.ok) {
        const err = await r.json().catch(() => ({ error: 'Upload failed' }));
        throw new Error(err.error || 'Upload failed');
      }

      fill.style.width = '100%';

      // Trigger zip download
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${name}.zip`;
      a.click();

      setStatus(`Skin "${name}" saved! ZIP downloaded. Go to Admin to schedule it.`, 'ok');

      // Show slice thumbnails
      showSlices(name);

    } catch (e) {
      setStatus(e.message, 'error');
      uploadBtn.disabled = false;
    }

    fill.style.width = '100%';
  }

  const SLICE_FILES = [
    'header-bg.png', 'drum-bg.png', 'weather-card-bg.png',
    'wave-row-bg.png', 'wind-row-bg.png', 'bunting-bg.png',
    'sunset-bg.png', 'sunrise-bg.png'
  ];

  function showSlices(name) {
    const grid = document.getElementById('slicesGrid');
    grid.innerHTML = '';
    SLICE_FILES.forEach(f => {
      const div = document.createElement('div');
      div.className = 'slice-thumb';
      div.innerHTML = `
        <img src="/skins/${name}/skin/${f}?t=${Date.now()}" alt="${f}"
             onerror="this.style.display='none'">
        <span>${f.replace('-bg.png','')}</span>
      `;
      grid.appendChild(div);
    });
    document.getElementById('slicesPreview').style.display = 'block';
  }
</script>

</body>
</html>
