<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אל הים</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="אל הים" />
  <meta name="theme-color" content="#0D47A1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text">טוען נתונים...</p>
  </div>

  <!-- Header / Logo -->
  <header>
    <div class="logo-wrap">
      <canvas class="logo-img" id="logoCanvas"></canvas>
      <div class="logo-sub">נווה ים</div>
    </div>
  </header>

  <!-- ─── Drum day picker ──────────────────────────────────────────────────────── -->
  <div class="drum-wrapper">
    <div class="drum-track" id="drumTrack">
      <!-- populated by buildDrum() in script.js -->
    </div>
    <div class="drum-fade drum-fade-left"></div>
    <div class="drum-fade drum-fade-right"></div>
    <div class="drum-ring"></div>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="errorBanner" role="alert"></div>

  <!-- ─── Data matrix ──────────────────────────────────────────────────────────── -->
  <main class="matrix">

    <!-- Column headers with time-of-day icons -->
    <div class="col-header-row">
      <div class="col-header"><span class="col-icon">🌤️</span><span>בוקר</span></div>
      <div class="col-header"><span class="col-icon">🌞</span><span>צהריים</span></div>
      <div class="col-header"><span class="col-icon">🌇</span><span>ערב</span></div>
    </div>

    <!-- Weather row -->
    <div class="mx-row" id="weatherRow">
      <div class="mx-cell wx-cell" id="wx0"></div>
      <div class="mx-cell wx-cell" id="wx1"></div>
      <div class="mx-cell wx-cell" id="wx2"></div>
    </div>

    <!-- Wave row (includes sea surface temperature) -->
    <div class="mx-row" id="waveRow">
      <div class="mx-cell wv-cell" id="wv0">
        <canvas class="wave-cvs" id="waveCanvas0"></canvas>
        <div class="sea-temp" id="seaTemp0">--°</div>
        <div class="wv-val" id="waveVal0">--</div>
      </div>
      <div class="mx-cell wv-cell" id="wv1">
        <canvas class="wave-cvs" id="waveCanvas1"></canvas>
        <div class="sea-temp" id="seaTemp1">--°</div>
        <div class="wv-val" id="waveVal1">--</div>
      </div>
      <div class="mx-cell wv-cell" id="wv2">
        <canvas class="wave-cvs" id="waveCanvas2"></canvas>
        <div class="sea-temp" id="seaTemp2">--°</div>
        <div class="wv-val" id="waveVal2">--</div>
      </div>
    </div>

    <!-- Wind row: Leaflet maps + particle animation -->
    <div class="mx-row" id="windRow">
      <div class="mx-cell wd-cell">
        <div class="wd-map-wrap">
          <div id="windMap0"></div>
          <canvas id="windCanvas0"></canvas>
        </div>
        <div class="wd-badge" id="windBadge0">--</div>
      </div>
      <div class="mx-cell wd-cell">
        <div class="wd-map-wrap">
          <div id="windMap1"></div>
          <canvas id="windCanvas1"></canvas>
        </div>
        <div class="wd-badge" id="windBadge1">--</div>
      </div>
      <div class="mx-cell wd-cell">
        <div class="wd-map-wrap">
          <div id="windMap2"></div>
          <canvas id="windCanvas2"></canvas>
        </div>
        <div class="wd-badge" id="windBadge2">--</div>
      </div>
    </div>

    <!-- Sunrise / Sunset — bottom row -->
    <div class="sun-row">
      <div class="mx-cell sun-tile sunrise-tile">
        <div class="sun-info">
          <div class="sun-label">זריחה</div>
          <div class="sun-time" id="sunriseVal">--:--</div>
        </div>
      </div>
      <div class="mx-cell sun-tile sunset-tile">
        <div class="sun-info">
          <div class="sun-label">שקיעה</div>
          <div class="sun-time" id="sunsetVal">--:--</div>
        </div>
      </div>
    </div>

  </main>

  <footer>
    <span id="lastUpdated">טרם עודכן</span>
    &nbsp;·&nbsp;
    <span>מתרענן כל 30 דקות</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>

  <!-- Remove white background from logo JPEG, then crop to visible pixels -->
  <script>
    (function () {
      const canvas = document.getElementById('logoCanvas');
      const ctx    = canvas.getContext('2d');
      const img    = new Image();
      img.onload = function () {
        canvas.width  = img.naturalWidth;
        canvas.height = img.naturalHeight;
        ctx.drawImage(img, 0, 0);

        // 1. Remove near-white pixels
        const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d  = id.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i] > 235 && d[i+1] > 235 && d[i+2] > 235) d[i+3] = 0;
        }
        ctx.putImageData(id, 0, 0);

        // 2. Find bounding box of visible (non-transparent) pixels
        let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;
        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            const a = d[(y * canvas.width + x) * 4 + 3];
            if (a > 0) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        // 3. Crop canvas to bounding box
        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;
        const cropped = ctx.getImageData(minX, minY, cropW, cropH);
        canvas.width  = cropW;
        canvas.height = cropH;
        ctx.putImageData(cropped, 0, 0);
      };
      img.src = 'logo.jpeg?v=2';
    })();
  </script>
</body>
</html>
