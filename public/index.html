<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אל הים</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="אל הים" />
  <meta name="theme-color" content="#8B6914" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text">טוען נתונים...</p>
  </div>

  <!-- Header / Logo -->
  <header>
    <div class="logo-wrap">
      <img class="logo-img" id="logoImg" src="El-Hayim%20by%20the%20beach.png?v=1" alt="אל הים" />
      <div class="logo-sub">נווה ים</div>
    </div>
  </header>

  <!-- ─── Drum day picker ──────────────────────────────────────────────────────── -->
  <div class="drum-wrapper">
    <div class="drum-track" id="drumTrack">
      <!-- populated by buildDrum() in script.js -->
    </div>
    <div class="drum-fade drum-fade-left"></div>
    <div class="drum-fade drum-fade-right"></div>
    <div class="drum-ring"></div>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="errorBanner" role="alert"></div>

  <!-- ─── Data matrix ──────────────────────────────────────────────────────────── -->
  <main class="matrix">

    <!-- Column headers with time-of-day icons -->
    <div class="col-header-row">
      <div class="col-header"><img class="col-icon-img" src="Smiling%20sun%20in%20wavy%20ocean.png" alt="בוקר"><span>בוקר</span></div>
      <div class="col-header"><img class="col-icon-img" src="Smiling%20sun%20with%20radiant%20rays.png" alt="צהריים"><span>צהריים</span></div>
      <div class="col-header"><img class="col-icon-img" src="Tropical%20sunset%20with%20palm%20trees.png" alt="ערב"><span>ערב</span></div>
    </div>

    <!-- Weather row -->
    <div class="mx-row" id="weatherRow">
      <div class="mx-cell wx-cell" id="wx0"></div>
      <div class="mx-cell wx-cell" id="wx1"></div>
      <div class="mx-cell wx-cell" id="wx2"></div>
    </div>

    <!-- Wave row (includes sea surface temperature) -->
    <div class="mx-row" id="waveRow">
      <div class="mx-cell wv-cell" id="wv0">
        <canvas class="wave-cvs" id="waveCanvas0"></canvas>
        <div class="wv-val" id="waveVal0">--</div>
        <div class="sea-temp" id="seaTemp0">--°</div>
      </div>
      <div class="mx-cell wv-cell" id="wv1">
        <canvas class="wave-cvs" id="waveCanvas1"></canvas>
        <div class="wv-val" id="waveVal1">--</div>
        <div class="sea-temp" id="seaTemp1">--°</div>
      </div>
      <div class="mx-cell wv-cell" id="wv2">
        <canvas class="wave-cvs" id="waveCanvas2"></canvas>
        <div class="wv-val" id="waveVal2">--</div>
        <div class="sea-temp" id="seaTemp2">--°</div>
      </div>
    </div>

    <!-- Wind row: schematic canvas animation -->
    <div class="mx-row" id="windRow">
      <div class="mx-cell wd-cell">
        <canvas id="windCanvas0" class="wind-cvs"></canvas>
        <div class="wd-badge" id="windBadge0">--</div>
      </div>
      <div class="mx-cell wd-cell">
        <canvas id="windCanvas1" class="wind-cvs"></canvas>
        <div class="wd-badge" id="windBadge1">--</div>
      </div>
      <div class="mx-cell wd-cell">
        <canvas id="windCanvas2" class="wind-cvs"></canvas>
        <div class="wd-badge" id="windBadge2">--</div>
      </div>
    </div>

    <!-- Sunrise / Sunset — bottom row -->
    <div class="sun-row">
      <div class="mx-cell sun-tile sunrise-tile">
        <div class="sun-info">
          <div class="sun-label">זריחה</div>
          <div class="sun-time" id="sunriseVal">--:--</div>
        </div>
      </div>
      <div class="mx-cell sun-tile sunset-tile">
        <div class="sun-info">
          <div class="sun-label">שקיעה</div>
          <div class="sun-time" id="sunsetVal">--:--</div>
        </div>
      </div>
    </div>

  </main>

  <footer>
    <span id="lastUpdated">טרם עודכן</span>
    &nbsp;·&nbsp;
    <span>מתרענן כל 30 דקות</span>
  </footer>

  <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.8/dist/lottie-player.js"></script>
  <script src="script.js"></script>

  <!-- Trim transparent padding from logo PNG so header gaps are exact -->
  <script>
    (function () {
      const logoImg = document.getElementById('logoImg');
      function trimLogo() {
        const c = document.createElement('canvas');
        c.width  = logoImg.naturalWidth;
        c.height = logoImg.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(logoImg, 0, 0);
        const d = ctx.getImageData(0, 0, c.width, c.height).data;
        let minY = c.height, maxY = 0;
        for (let y = 0; y < c.height; y++) {
          for (let x = 0; x < c.width; x++) {
            if (d[(y * c.width + x) * 4 + 3] > 10) {
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        // rendered height based on CSS width
        const renderedH = logoImg.offsetWidth * (c.height / c.width);
        const topPx     = Math.floor(minY              / c.height * renderedH);
        const bottomPx  = Math.floor((c.height - maxY) / c.height * renderedH);
        logoImg.style.marginTop    = `-${topPx}px`;
        logoImg.style.marginBottom = `-${bottomPx}px`;
      }
      if (logoImg.complete && logoImg.naturalWidth) trimLogo();
      else logoImg.addEventListener('load', trimLogo);
    })();
  </script>

</body>
</html>
