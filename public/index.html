<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>איים בזרם נווה ים</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Waves" />
  <meta name="theme-color" content="#0D47A1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text">טוען נתונים...</p>
  </div>

  <!-- Header -->
  <header>
    <h1 class="app-title">🌊 איים בזרם נווה ים</h1>
  </header>

  <!-- ─── Drum day picker: 3 days visible, center = selected ──────────────── -->
  <div class="drum-wrapper">
    <div class="drum-track" id="drumTrack">
      <!-- populated by buildDrum() in script.js -->
    </div>
    <div class="drum-fade drum-fade-left"></div>
    <div class="drum-fade drum-fade-right"></div>
    <div class="drum-ring"></div>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="errorBanner" role="alert"></div>

  <!-- ─── Data matrix ───────────────────────────────────────────────────────── -->
  <main class="matrix">

    <!-- Sunrise / Sunset — 2 tiles, same height as data rows -->
    <div class="sun-row">
      <!-- Sunrise tile (right in RTL = first DOM child) -->
      <div class="mx-cell sun-tile sunrise-tile">
        <div class="sun-info">
          <div class="sun-label">זריחה</div>
          <div class="sun-time" id="sunriseVal">--:--</div>
        </div>
      </div>
      <!-- Sunset tile (left in RTL = second DOM child) -->
      <div class="mx-cell sun-tile sunset-tile">
        <div class="sun-info">
          <div class="sun-label">שקיעה</div>
          <div class="sun-time" id="sunsetVal">--:--</div>
        </div>
      </div>
    </div>

    <!-- Column headers: DOM order = [morning, noon, evening]; RTL renders right→left -->
    <div class="col-header-row">
      <div class="col-header">בוקר</div>
      <div class="col-header">צהריים</div>
      <div class="col-header">ערב</div>
    </div>

    <!-- Weather row -->
    <div class="mx-row" id="weatherRow">
      <div class="mx-cell wx-cell" id="wx0"></div>
      <div class="mx-cell wx-cell" id="wx1"></div>
      <div class="mx-cell wx-cell" id="wx2"></div>
    </div>

    <!-- Wave row -->
    <div class="mx-row" id="waveRow">
      <div class="mx-cell wv-cell" id="wv0">
        <canvas class="wave-cvs" id="waveCanvas0"></canvas>
        <div class="wv-val" id="waveVal0">--</div>
      </div>
      <div class="mx-cell wv-cell" id="wv1">
        <canvas class="wave-cvs" id="waveCanvas1"></canvas>
        <div class="wv-val" id="waveVal1">--</div>
      </div>
      <div class="mx-cell wv-cell" id="wv2">
        <canvas class="wave-cvs" id="waveCanvas2"></canvas>
        <div class="wv-val" id="waveVal2">--</div>
      </div>
    </div>

    <!-- Wind row: Leaflet maps + particle animation -->
    <div class="mx-row" id="windRow">
      <div class="mx-cell wd-cell">
        <div class="wd-map-wrap">
          <div id="windMap0"></div>
          <canvas id="windCanvas0"></canvas>
        </div>
        <div class="wd-badge" id="windBadge0">--</div>
      </div>
      <div class="mx-cell wd-cell">
        <div class="wd-map-wrap">
          <div id="windMap1"></div>
          <canvas id="windCanvas1"></canvas>
        </div>
        <div class="wd-badge" id="windBadge1">--</div>
      </div>
      <div class="mx-cell wd-cell">
        <div class="wd-map-wrap">
          <div id="windMap2"></div>
          <canvas id="windCanvas2"></canvas>
        </div>
        <div class="wd-badge" id="windBadge2">--</div>
      </div>
    </div>

  </main>

  <footer>
    <span id="lastUpdated">טרם עודכן</span>
    &nbsp;·&nbsp;
    <span>מתרענן כל 30 דקות</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
