<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather 'n' Waves</title>
  <!-- PWA / home-screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Waves" />
  <meta name="theme-color" content="#0288D1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ─── Loading overlay (shown while fetching data) ─────────────────────── -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text">טוען נתונים...</p>
  </div>

  <!-- ─── Header: title + Hebrew week calendar ─────────────────────────────── -->
  <header>
    <h1 class="app-title">🌊 Weather 'n' Waves</h1>

    <!-- Hebrew letter days: א=Sun ב=Mon ג=Tue ד=Wed ה=Thu ו=Fri ש=Sat -->
    <div class="calendar" id="calendar" aria-label="ימי השבוע">
      <!-- Filled by script.js -->
    </div>

    <p class="city-label" id="cityLabel"></p>
    <!-- Shows which day is currently selected -->
    <p class="viewing-label" id="viewingLabel"></p>
  </header>

  <!-- ─── Wind Map Section ────────────────────────────────────────────────────── -->
  <section class="wind-section">
    <div class="wind-section-header">
      <span class="wind-section-title">💨 רוח</span>
      <span class="wind-badge" id="windBadge">--</span>
    </div>
    <div class="wind-map-wrapper">
      <!-- Leaflet map as background -->
      <div id="windMap"></div>
      <!-- Canvas for animated wind particles (on top of map) -->
      <canvas id="windCanvas"></canvas>
    </div>
  </section>

  <!-- ─── Main content ──────────────────────────────────────────────────────── -->
  <main>

    <!-- Error banner (hidden by default) -->
    <div class="error-banner" id="errorBanner" role="alert"></div>

    <!-- Two equal cards -->
    <div class="cards">

      <!-- Weather card -->
      <div class="card card-weather">
        <div class="card-title">מזג אוויר</div>
        <div class="time-slots" id="weatherSlots">
          <!-- 3 slots (morning/noon/evening) injected by script.js -->
        </div>
      </div>

      <!-- Waves card — map as background, whitecap animation overlay -->
      <div class="card card-waves">
        <!-- Map + whitecap canvas fills the card background -->
        <div class="wave-map-wrapper">
          <div id="waveMap"></div>
          <canvas id="whitecapCanvas"></canvas>
        </div>
        <!-- Content floats on top of the map -->
        <div class="card-title">גלים</div>
        <div class="time-slots" id="waveSlots">
          <!-- 3 slots injected by script.js -->
        </div>
      </div>

    </div><!-- /cards -->

  </main>

  <!-- ─── Footer: last updated ─────────────────────────────────────────────── -->
  <footer>
    <span id="lastUpdated">טרם עודכן</span>
    &nbsp;·&nbsp;
    <span>מתרענן כל 30 דקות</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
